<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo-List</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1> Create Your Todo List</h1>
        
        <div class="input-group">
            <input 
                type="text" 
                id="taskInput" .
                placeholder="Enter a task"
            >
            <button id="addBtn">Add Task</button>
        </div>

        <ul id="taskList" class="task-list">
            <li class="empty-message">No tasks yet. Add one above!</li>
        </ul>
    </div>

    <script>
        const addBtn = document.getElementById('addBtn');
        const taskList = document.getElementById('taskList');

        let tasks = [];

        renderTasks();

        addBtn.addEventListener('click', addTask);

        function addTask() {





            
            const taskInput = document.getElementById('taskInput');
            const taskText = taskInput.value.trim();
            
            if (taskText === '') {
                alert('Please enter a task!');
                return;
            }

            const task = {
                id: Date.now(),
                text: taskText,
                completed: false
            };

            tasks.push(task);
            renderTasks();
            taskInput.value = '';
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            renderTasks();
        }

        function completeTask(id) {
            const task = tasks.find(task => task.id === id);
            if (task) {
                task.completed = !task.completed;
                renderTasks();
            }
        }

        function editTask(id) {
            const task = tasks.find(task => task.id === id);
            if (task) {
                const newText = prompt('Edit task:', task.text);
                if (newText !== null && newText.trim() !== '') {
                    task.text = newText.trim();
                    renderTasks();
                }
            }
        }

      function renderTasks() {
    taskList.textContent = '';

    if (tasks.length === 0) {
        taskList.innerHTML = '<li class="empty-message">No tasks yet. Add one above!</li>';
    } else {
        tasks.forEach(task => {
            const li = document.createElement('li');
            li.className = `task-item ${task.completed ? 'completed' : ''}`;

            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = task.text; // safe — no HTML execution

            const buttonsDiv = document.createElement('div');
            buttonsDiv.className = 'task-buttons';
            buttonsDiv.innerHTML = `
                <button class="edit-btn" onclick="editTask(${task.id})">Edit</button>
                <button class="complete-btn" onclick="completeTask(${task.id})">${task.completed ? 'Completed' : 'Complete'}</button>
                <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
            `;

            li.appendChild(span);
            li.appendChild(buttonsDiv);
            taskList.appendChild(li);
        });
    }
}


    </script>
</body>
</html>
